<VirtualHost *:80>
    ServerName accountsmaster.masterbrainssolutions.com
    ServerAlias www.accountsmaster.masterbrainssolutions.com

    DocumentRoot /var/www/html/accountsmaster

    <Directory /var/www/html/accountsmaster>
        Options -Indexes
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [QSA,L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://localhost:8000/api/
    ProxyPassReverse /api/ http://localhost:8000/api/
    ProxyPass /uploads/ http://localhost:8000/uploads/
    ProxyPassReverse /uploads/ http://localhost:8000/uploads/
#RewriteCond %{SERVER_NAME} =accountsmaster.masterbrainssolutions.com [OR]
#RewriteCond %{SERVER_NAME} =www.accountsmaster.masterbrainssolutions.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>