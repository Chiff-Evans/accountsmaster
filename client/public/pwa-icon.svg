<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12c2e9"/>
      <stop offset="55%" stop-color="#4d7ff5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="48" fill="#1677ff"/>

  <!-- Browser window -->
  <rect x="40" y="90" width="320" height="300" rx="18" fill="#ffffff" stroke="url(#g)" stroke-width="14" stroke-linejoin="round"/>
  <line x1="40" y1="150" x2="360" y2="150" stroke="url(#g)" stroke-width="14"/>
  <circle cx="66" cy="120" r="7" fill="url(#g)"/>
  <circle cx="90" cy="120" r="7" fill="url(#g)"/>
  <circle cx="114" cy="120" r="7" fill="url(#g)"/>

  <!-- Profile -->
  <circle cx="112" cy="228" r="46" fill="none" stroke="url(#g)" stroke-width="12"/>
  <circle cx="112" cy="212" r="15" fill="none" stroke="url(#g)" stroke-width="10"/>
  <path d="M 84,254 Q 112,218 140,254" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>

  <!-- Title + text lines -->
  <rect x="205" y="178" width="130" height="22" rx="6" fill="url(#g)"/>
  <rect x="205" y="215" width="150" height="12" rx="6" fill="url(#g)"/>
  <rect x="205" y="238" width="150" height="12" rx="6" fill="url(#g)"/>
  <rect x="205" y="261" width="105" height="12" rx="6" fill="url(#g)"/>

  <!-- Content block -->
  <rect x="66" y="300" width="250" height="70" rx="10" fill="none" stroke="url(#g)" stroke-width="12"/>

  <!-- Gear -->
  <g>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8"/>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8" transform="rotate(45 390 380)"/>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8" transform="rotate(90 390 380)"/>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8" transform="rotate(135 390 380)"/>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8" transform="rotate(180 390 380)"/>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8" transform="rotate(225 390 380)"/>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8" transform="rotate(270 390 380)"/>
    <rect x="380" y="322" width="20" height="30" rx="4" fill="#ffffff" stroke="url(#g)" stroke-width="8" transform="rotate(315 390 380)"/>
    <circle cx="390" cy="380" r="40" fill="#ffffff" stroke="url(#g)" stroke-width="12"/>
    <circle cx="390" cy="380" r="14" fill="#ffffff" stroke="url(#g)" stroke-width="10"/>
  </g>

  <!-- Upward arrow through the gear -->
  <line x1="390" y1="472" x2="390" y2="345" stroke="url(#g)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 360,345 L 390,300 L 420,345" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
