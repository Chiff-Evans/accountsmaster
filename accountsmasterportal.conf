<VirtualHost *:80>
    ServerName accountsmasterportal.masterbrainssolutions.com
    DocumentRoot /var/www/html/accountsmasterportal

    # ── Proxy MUST come before Directory block ──────────────────────────────
    ProxyPreserveHost On
    ProxyPass        /api      http://localhost:8000/api
    ProxyPassReverse /api      http://localhost:8000/api
    ProxyPass        /uploads  http://localhost:8000/uploads
    ProxyPassReverse /uploads  http://localhost:8000/uploads

    <Directory /var/www/html/accountsmasterportal>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA fallback — but never intercept /api or /uploads
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_URI} ^/api [OR]
        RewriteCond %{REQUEST_URI} ^/uploads
        RewriteRule ^ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Security headers
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Cache hashed static assets aggressively
    <FilesMatch "\.(js|css|woff2|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # Never cache index.html (PWA entry point)
    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    ErrorLog  ${APACHE_LOG_DIR}/portal-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-access.log combined
</VirtualHost>