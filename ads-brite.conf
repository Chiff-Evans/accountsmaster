<VirtualHost *:80>
    ServerName ads-brite.masterbrainssolutions.com
    ServerAlias www.ads-brite.masterbrainssolutions.com

    DocumentRoot /var/www/html/ads-brite

    <Directory /var/www/html/ads-brite>
        Options -Indexes
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [QSA,L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://localhost:7100/api/
    ProxyPassReverse /api/ http://localhost:7100/api/
    ProxyPass /uploads/ http://localhost:7100/uploads/
    ProxyPassReverse /uploads/ http://localhost:7100/uploads/
#RewriteCond %{SERVER_NAME} =ads-brite.masterbrainssolutions.com [OR]
#RewriteCond %{SERVER_NAME} =www.ads-brite.masterbrainssolutions.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>