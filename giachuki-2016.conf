<VirtualHost *:80>
    ServerName giachuki-2016.masterbrainssolutions.com
    ServerAlias www.giachuki-2016.masterbrainssolutions.com

    DocumentRoot /var/www/html/giachuki-2016

    <Directory /var/www/html/giachuki-2016>
        Options -Indexes
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [QSA,L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://localhost:8100/api/
    ProxyPassReverse /api/ http://localhost:8100/api/
    ProxyPass /uploads/ http://localhost:8100/uploads/
    ProxyPassReverse /uploads/ http://localhost:8100/uploads/
#RewriteCond %{SERVER_NAME} =giachuki-2016.masterbrainssolutions.com [OR]
#RewriteCond %{SERVER_NAME} =www.giachuki-2016.masterbrainssolutions.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>